# /etc/nginx/sites-available/erp-freela-api  (ln -s em sites-enabled; depois certbot --nginx -d api-erp.freelaservicosapp.com.br)
server {
    listen 80;
    server_name api-erp.freelaservicosapp.com.br;

    # Importação de vendas (milhares de linhas) e PDF de nota (10 MB) passam no corpo.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta): o throttle da API confia neste cabeçalho (TRUST_PROXY=true).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Leitura de PDF pela IA pode levar até ~2 min.
        proxy_read_timeout 180s;
    }
}
